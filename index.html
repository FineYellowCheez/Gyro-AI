<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Core Gallery</title>
    <style>
        :root {
            --bg: #090a0f;
            --card-bg: #151823;
            --text: #e2e8f0;
            --cyan: #00f2fe;
            --purple: #8a2be2;
            --magenta: #ff007f;
            --green: #00ff88;
            --orange: #ffaa00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            padding: 40px;
            text-align: center;
        }

        h1 { margin-bottom: 10px; font-weight: 900; letter-spacing: 2px; }
        p { color: #8892b0; margin-bottom: 40px; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.1);
        }

        .card-name {
            margin-top: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- BASE LOGO CONTAINER --- */
        .logo-container {
            width: 80px; height: 80px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. NOVA CORE */
        .nova-core {
            width: 40px; height: 40px;
            background: var(--cyan);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--cyan);
            animation: nova-pulse 2s infinite alternate;
        }
        @keyframes nova-pulse {
            0% { transform: scale(0.8); box-shadow: 0 0 10px var(--cyan); }
            100% { transform: scale(1.5); box-shadow: 0 0 40px var(--cyan), 0 0 80px var(--purple); }
        }

        /* 2. VORTEX */
        .vortex { width: 100%; height: 100%; animation: spin 4s linear infinite; }
        .vortex::before, .vortex::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            border: 4px solid transparent; border-radius: 50%;
        }
        .vortex::before { border-top-color: var(--magenta); border-bottom-color: var(--cyan); animation: spin 2s linear infinite; }
        .vortex::after { border-left-color: var(--purple); border-right-color: var(--orange); animation: spin 3s linear infinite reverse; transform: scale(0.7); }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 3. QUANTUM GRID */
        .grid-logo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 60px; height: 60px; transform: rotate(45deg); }
        .grid-dot { background: var(--green); border-radius: 4px; animation: grid-fade 1.5s infinite alternate; }
        .grid-dot:nth-child(1) { animation-delay: 0.1s; } .grid-dot:nth-child(2) { animation-delay: 0.2s; }
        .grid-dot:nth-child(3) { animation-delay: 0.3s; } .grid-dot:nth-child(4) { animation-delay: 0.4s; }
        .grid-dot:nth-child(5) { animation-delay: 0.5s; } .grid-dot:nth-child(6) { animation-delay: 0.6s; }
        .grid-dot:nth-child(7) { animation-delay: 0.7s; } .grid-dot:nth-child(8) { animation-delay: 0.8s; }
        .grid-dot:nth-child(9) { animation-delay: 0.9s; }
        @keyframes grid-fade { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px var(--green); } }

        /* 4. HYPERCUBE */
        .hypercube { width: 60px; height: 60px; border: 4px solid var(--purple); transform-style: preserve-3d; animation: cube-spin 4s infinite linear; }
        .hypercube::before { content: ''; position: absolute; width: 100%; height: 100%; border: 4px solid var(--cyan); transform: translateZ(30px); }
        @keyframes cube-spin { to { transform: rotateX(360deg) rotateY(360deg); } }

        /* 5. ECHO WAVE */
        .echo-wave { display: flex; gap: 4px; height: 60px; align-items: center; }
        .bar { width: 8px; background: var(--orange); border-radius: 4px; animation: eq 1.2s ease-in-out infinite; }
        .bar:nth-child(1) { animation-delay: 0.0s; height: 20px; }
        .bar:nth-child(2) { animation-delay: 0.2s; height: 60px; }
        .bar:nth-child(3) { animation-delay: 0.4s; height: 40px; }
        .bar:nth-child(4) { animation-delay: 0.6s; height: 80px; }
        .bar:nth-child(5) { animation-delay: 0.8s; height: 30px; }
        @keyframes eq { 0%, 100% { transform: scaleY(0.3); opacity: 0.5; } 50% { transform: scaleY(1); opacity: 1; box-shadow: 0 0 15px var(--orange); } }

        /* 6. RADAR EYE */
        .radar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid rgba(0, 242, 254, 0.3); position: relative; overflow: hidden; }
        .radar::before {
            content: ''; position: absolute; width: 50%; height: 50%; bottom: 50%; right: 50%;
            background: linear-gradient(to bottom right, transparent, var(--cyan));
            transform-origin: bottom right; animation: scan 2s linear infinite;
        }
        @keyframes scan { to { transform: rotate(360deg); } }

        /* 7. NEON HEX */
        .hex { width: 60px; height: 70px; background: transparent; border: 4px solid var(--magenta); box-shadow: inset 0 0 15px var(--magenta), 0 0 15px var(--magenta); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); animation: hex-breathe 3s ease-in-out infinite alternate; }
        @keyframes hex-breathe { 0% { transform: rotate(0deg) scale(0.8); } 100% { transform: rotate(180deg) scale(1.1); } }

        /* 8. ASTRO ORBIT */
        .astro { width: 15px; height: 15px; background: var(--text); border-radius: 50%; position: relative; box-shadow: 0 0 10px white; }
        .orbit-path { position: absolute; width: 80px; height: 80px; border: 1px dashed rgba(255,255,255,0.2); border-radius: 50%; animation: spin 4s linear infinite; }
        .orbit-path::before { content: ''; position: absolute; top: -5px; left: 35px; width: 10px; height: 10px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 10px var(--cyan); }
        .orbit-path-2 { width: 120px; height: 120px; animation: spin 6s linear infinite reverse; }
        .orbit-path-2::before { background: var(--purple); box-shadow: 0 0 10px var(--purple); left: 55px; }

        /* 9. PRISM SHARD */
        .prism { width: 0; height: 0; border-left: 30px solid transparent; border-right: 30px solid transparent; border-bottom: 60px solid var(--green); position: relative; animation: prism-spin 3s linear infinite; transform-origin: 50% 66%; }
        .prism::after { content: ''; position: absolute; top: 60px; left: -30px; border-left: 30px solid transparent; border-right: 30px solid transparent; border-top: 60px solid rgba(0, 255, 136, 0.3); }
        @keyframes prism-spin { to { transform: rotateY(360deg); filter: hue-rotate(90deg); } }

        /* 10. REACTOR */
        .reactor { width: 80px; height: 80px; border: 6px dashed var(--orange); border-radius: 50%; animation: spin 5s linear infinite; display: flex; justify-content: center; align-items: center; }
        .reactor-inner { width: 40px; height: 40px; border: 4px dotted var(--text); border-radius: 50%; animation: spin 3s linear infinite reverse; }

        /* 11. INFINITY LOOP */
        .infinity { width: 80px; height: 40px; position: relative; }
        .infinity::before, .infinity::after { content: ''; position: absolute; top: 0; width: 40px; height: 40px; border: 6px solid transparent; border-radius: 50px 50px 0 50px; border-top-color: var(--cyan); border-left-color: var(--cyan); animation: inf-spin 1.5s linear infinite; }
        .infinity::after { right: 0; border-radius: 50px 50px 50px 0; border-top-color: var(--magenta); border-right-color: var(--magenta); border-left-color: transparent; animation: inf-spin-rev 1.5s linear infinite; }
        @keyframes inf-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes inf-spin-rev { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        /* 12. DATA STREAM */
        .datastream { display: flex; flex-direction: column; gap: 8px; width: 60px; }
        .data-line { height: 4px; background: var(--cyan); border-radius: 2px; animation: data-move 1s infinite alternate; }
        .data-line:nth-child(1) { width: 100%; animation-delay: 0s; }
        .data-line:nth-child(2) { width: 60%; background: var(--purple); animation-delay: 0.2s; }
        .data-line:nth-child(3) { width: 80%; background: var(--magenta); animation-delay: 0.4s; }
        .data-line:nth-child(4) { width: 40%; background: var(--green); animation-delay: 0.6s; }
        @keyframes data-move { 0% { transform: translateX(-10px); opacity: 0.4; } 100% { transform: translateX(10px); opacity: 1; } }

    </style>
</head>
<body>

    <h1>AI Core Selection</h1>
    <p>Choose your aesthetic matrix. Select a prototype to define your AI.</p>

    <div class="gallery">
        <div class="card"><div class="logo-container"><div class="nova-core"></div></div><div class="card-name">1. Nova Core</div></div>
        <div class="card"><div class="logo-container"><div class="vortex"></div></div><div class="card-name">2. Vortex</div></div>
        <div class="card"><div class="logo-container"><div class="grid-logo"><div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div></div></div><div class="card-name">3. Quantum Grid</div></div>
        <div class="card"><div class="logo-container"><div class="hypercube"></div></div><div class="card-name">4. Hypercube</div></div>
        <div class="card"><div class="logo-container"><div class="echo-wave"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></div><div class="card-name">5. Echo Wave</div></div>
        <div class="card"><div class="logo-container"><div class="radar"></div></div><div class="card-name">6. Radar Eye</div></div>
        <div class="card"><div class="logo-container"><div class="hex"></div></div><div class="card-name">7. Neon Hex</div></div>
        <div class="card"><div class="logo-container"><div class="astro"><div class="orbit-path"></div><div class="orbit-path orbit-path-2"></div></div></div><div class="card-name">8. Astro Orbit</div></div>
        <div class="card"><div class="logo-container"><div class="prism"></div></div><div class="card-name">9. Prism Shard</div></div>
        <div class="card"><div class="logo-container"><div class="reactor"><div class="reactor-inner"></div></div></div><div class="card-name">10. Reactor</div></div>
        <div class="card"><div class="logo-container"><div class="infinity"></div></div><div class="card-name">11. Infinity Loop</div></div>
        <div class="card"><div class="logo-container"><div class="datastream"><div class="data-line"></div><div class="data-line"></div><div class="data-line"></div><div class="data-line"></div></div></div><div class="card-name">12. Data Stream</div></div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataStream AI</title>
    <style>
        /* --- Color Palette --- */
        :root {
            --bg-color: #0f172a;        
            --header-bg: #1e293b;       
            --border-color: #334155;    
            --accent-cyan: #00f2fe;     
            --accent-purple: #8a2be2;
            --accent-magenta: #ff007f;
            --accent-green: #00ff88;
            --user-bubble: #334155;     
            --ai-bubble: #1e293b;     
            --text-main: #f8fafc;       
            --text-muted: #94a3b8;      
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .api-key-container input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
            width: 280px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .api-key-container input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.2);
        }

        /* --- Chat Area --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        main::-webkit-scrollbar { width: 8px; }
        main::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        /* --- Welcome Screen --- */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .welcome-text {
            margin-top: 40px;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- Chat Messages --- */
        .message-row {
            display: flex;
            margin-bottom: 25px;
            max-width: 85%;
            animation: slideUp 0.3s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.ai {
            align-self: flex-start;
        }

        .avatar {
            width: 45px;
            height: 45px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 15px;
        }

        .user-avatar {
            background-color: var(--border-color);
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .bubble {
            padding: 16px 20px;
            border-radius: 12px;
            color: var(--text-main);
            line-height: 1.6;
            font-size: 1.05rem;
            white-space: pre-wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .message-row.user .bubble {
            background-color: var(--user-bubble);
            border-top-right-radius: 4px;
        }

        .message-row.ai .bubble {
            background-color: var(--ai-bubble);
            border: 1px solid var(--border-color);
            border-top-left-radius: 4px;
            box-shadow: -4px 0 0 var(--accent-cyan);
        }

        /* --- Input Area --- */
        .input-area {
            padding: 20px 30px;
            background-color: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
        }

        .input-area textarea {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            outline: none;
            height: 55px;
            transition: all 0.2s;
        }

        .input-area textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.2);
        }

        .send-btn {
            background-color: transparent;
            border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan);
            border-radius: 12px;
            padding: 0 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .send-btn:hover {
            background-color: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        /* --- DATA STREAM LOGO ANIMATION --- */
        .logo-box {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .size-lg { width: 120px; height: 120px; }
        .size-sm { width: 45px; height: 45px; }

        .datastream {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15%; /* Spacing between lines relative to container */
            width: 100%;
            height: 100%;
        }

        .data-line {
            height: 8%; /* Thickness of lines */
            border-radius: 10px;
            animation: data-move 1.2s infinite alternate ease-in-out;
        }

        /* Colors and widths for the 4 distinct lines */
        .data-line:nth-child(1) { width: 100%; background: var(--accent-cyan); animation-delay: 0s; box-shadow: 0 0 10px var(--accent-cyan); }
        .data-line:nth-child(2) { width: 65%; background: var(--accent-purple); animation-delay: 0.2s; box-shadow: 0 0 10px var(--accent-purple); }
        .data-line:nth-child(3) { width: 85%; background: var(--accent-magenta); animation-delay: 0.4s; box-shadow: 0 0 10px var(--accent-magenta); }
        .data-line:nth-child(4) { width: 45%; background: var(--accent-green); animation-delay: 0.6s; box-shadow: 0 0 10px var(--accent-green); }

        @keyframes data-move {
            0% { transform: translateX(-15%); opacity: 0.6; }
            100% { transform: translateX(15%); opacity: 1; }
        }

        /* Loader */
        .typing-indicator {
            color: var(--accent-cyan);
            font-style: italic;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <div class="logo-box size-sm">
                <div class="datastream">
                    <div class="data-line"></div>
                    <div class="data-line"></div>
                    <div class="data-line"></div>
                    <div class="data-line"></div>
                </div>
            </div>
            DataStream
        </div>
        <div class="api-key-container">
            <input type="text" id="api-key" placeholder="Paste Groq API Key here..." autocomplete="off">
        </div>
    </header>

    <main id="chat-container">
        <div id="welcome-screen">
            <div class="logo-box size-lg">
                <div class="datastream">
                    <div class="data-line"></div>
                    <div class="data-line"></div>
                    <div class="data-line"></div>
                    <div class="data-line"></div>
                </div>
            </div>
            <div class="welcome-text">Stream Initialized.</div>
        </div>
    </main>

    <div class="input-area">
        <textarea id="user-input" placeholder="Transmit data... (Type your message here)" onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        // System prompt updated to the new identity
        let messages = [
            { role: "system", content: "Your name is DataStream. You are a highly efficient, intelligent, and helpful AI assistant." }
        ];

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('api-key');
        const welcomeScreen = document.getElementById('welcome-screen');

        function createMessageElement(text, sender) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            
            if (sender === 'ai') {
                // DataStream animated avatar
                avatar.innerHTML = `
                    <div class="logo-box size-sm">
                        <div class="datastream">
                            <div class="data-line"></div>
                            <div class="data-line"></div>
                            <div class="data-line"></div>
                            <div class="data-line"></div>
                        </div>
                    </div>
                `;
            } else {
                // User avatar
                const userIcon = document.createElement('div');
                userIcon.className = 'user-avatar avatar';
                userIcon.innerText = 'USR';
                avatar.appendChild(userIcon);
            }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = text;

            row.appendChild(avatar);
            row.appendChild(bubble);
            return row;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;
            
            if (!apiKey) {
                alert("Please paste your Groq API Key in the top right box to establish connection.");
                return;
            }

            if (welcomeScreen.style.display !== 'none') {
                welcomeScreen.style.display = 'none';
            }

            // User Message
            const userMsgElement = createMessageElement(text, 'user');
            chatContainer.appendChild(userMsgElement);
            messages.push({ role: "user", content: text });
            
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading Indicator
            const loadingId = 'loading-' + Date.now();
            const loadingElement = createMessageElement('Receiving stream...', 'ai');
            loadingElement.id = loadingId;
            loadingElement.querySelector('.bubble').classList.add('typing-indicator');
            chatContainer.appendChild(loadingElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192", 
                        messages: messages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                document.getElementById(loadingId).remove();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiReply = data.choices[0].message.content;
                messages.push({ role: "assistant", content: aiReply });

                // AI Message
                const aiMsgElement = createMessageElement(aiReply, 'ai');
                chatContainer.appendChild(aiMsgElement);
                
            } catch (error) {
                document.getElementById(loadingId).remove();
                const errorElement = createMessageElement(`Connection Error: ${error.message}`, 'ai');
                errorElement.querySelector('.bubble').style.color = '#ef4444'; 
                chatContainer.appendChild(errorElement);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>

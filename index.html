<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyro AI</title>
    <style>
        /* --- Color Palette (Easier on the eyes) --- */
        :root {
            --bg-color: #0f172a;        /* Deep slate background */
            --header-bg: #1e293b;       /* Slightly lighter slate for header */
            --border-color: #334155;    /* Soft border color */
            --accent-cyan: #0ea5e9;     /* Soft, readable cyan */
            --accent-cyan-glow: rgba(14, 165, 233, 0.3);
            --user-bubble: #334155;     /* Dark gray user bubble */
            --gyro-bubble: #1e293b;     /* Slate gyro bubble */
            --text-main: #f8fafc;       /* Bright white text */
            --text-muted: #94a3b8;      /* Muted text for placeholders */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .api-key-container input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
            width: 280px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .api-key-container input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px var(--accent-cyan-glow);
        }

        /* --- Chat Area --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        main::-webkit-scrollbar {
            width: 8px;
        }
        main::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        /* --- Welcome Screen --- */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .welcome-text {
            margin-top: 40px;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* --- Chat Messages --- */
        .message-row {
            display: flex;
            margin-bottom: 25px;
            max-width: 85%;
            animation: slideUp 0.3s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.gyro {
            align-self: flex-start;
        }

        .avatar {
            width: 45px;
            height: 45px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 15px;
        }

        .user-avatar {
            background-color: var(--accent-cyan);
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Distinct, solid chat bubbles so text is always visible */
        .bubble {
            padding: 16px 20px;
            border-radius: 12px;
            color: var(--text-main);
            line-height: 1.6;
            font-size: 1.05rem;
            white-space: pre-wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .message-row.user .bubble {
            background-color: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }

        .message-row.gyro .bubble {
            background-color: var(--gyro-bubble);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-cyan); /* Clear indicator it's Gyro */
            border-bottom-left-radius: 4px;
        }

        /* --- Input Area --- */
        .input-area {
            padding: 20px 30px;
            background-color: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
        }

        .input-area textarea {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            outline: none;
            height: 55px;
            transition: all 0.2s;
        }

        .input-area textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px var(--accent-cyan-glow);
        }

        .send-btn {
            background-color: var(--accent-cyan);
            border: none;
            color: white;
            border-radius: 12px;
            padding: 0 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #0284c7; /* Darker cyan on hover */
        }

        /* --- REALISTIC GYROSCOPE LOGO --- */
        .gyro-box {
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px; /* Gives the 3D effect depth */
        }

        .size-lg { width: 140px; height: 140px; }
        .size-sm { width: 45px; height: 45px; }

        .gyro-frame, .gyro-gimbal, .gyro-rotor {
            position: absolute;
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        /* Outer Frame (Slow rotation) */
        .gyro-frame {
            width: 100%; 
            height: 100%;
            border: 4px solid #64748b; /* Gray metal frame */
            transform: rotateX(60deg) rotateY(15deg);
            animation: rotate-frame 8s linear infinite;
        }
        .size-sm .gyro-frame { border-width: 2px; }

        /* Inner Gimbal (Pivoting) */
        .gyro-gimbal {
            width: 80%; 
            height: 80%;
            top: 10%; 
            left: 10%;
            border: 4px solid var(--accent-cyan);
            animation: rotate-gimbal 3s linear infinite;
        }
        .size-sm .gyro-gimbal { border-width: 2px; }

        /* Central Rotor (Spinning fast) */
        .gyro-rotor {
            width: 60%; 
            height: 60%;
            top: 20%; 
            left: 20%;
            background: rgba(14, 165, 233, 0.15); /* Semi-transparent disc */
            border: 8px solid #cbd5e1; /* Thick silver edge */
            animation: rotate-rotor 0.5s linear infinite;
        }
        .size-sm .gyro-rotor { border-width: 4px; }

        @keyframes rotate-frame {
            0% { transform: rotateX(60deg) rotateY(15deg) rotateZ(0deg); }
            100% { transform: rotateX(60deg) rotateY(15deg) rotateZ(360deg); }
        }
        @keyframes rotate-gimbal {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(360deg); }
        }
        @keyframes rotate-rotor {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* Loader */
        .typing-indicator {
            color: var(--accent-cyan);
            font-style: italic;
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <div class="gyro-box size-sm">
                <div class="gyro-frame">
                    <div class="gyro-gimbal">
                        <div class="gyro-rotor"></div>
                    </div>
                </div>
            </div>
            Gyro
        </div>
        <div class="api-key-container">
            <input type="text" id="api-key" placeholder="Paste Groq API Key here..." autocomplete="off">
        </div>
    </header>

    <main id="chat-container">
        <div id="welcome-screen">
            <div class="gyro-box size-lg">
                <div class="gyro-frame">
                    <div class="gyro-gimbal">
                        <div class="gyro-rotor"></div>
                    </div>
                </div>
            </div>
            <div class="welcome-text">Ready for input.</div>
        </div>
    </main>

    <div class="input-area">
        <textarea id="user-input" placeholder="Type your message to Gyro here..." onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        // System prompt
        let messages = [
            { role: "system", content: "Your name is Gyro. You are a helpful, clear, and highly capable AI assistant." }
        ];

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('api-key');
        const welcomeScreen = document.getElementById('welcome-screen');

        function createMessageElement(text, sender) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            
            if (sender === 'gyro') {
                // Gyro's animated avatar
                avatar.innerHTML = `
                    <div class="gyro-box size-sm">
                        <div class="gyro-frame">
                            <div class="gyro-gimbal">
                                <div class="gyro-rotor"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // User's avatar
                const userIcon = document.createElement('div');
                userIcon.className = 'user-avatar avatar';
                userIcon.innerText = 'U';
                avatar.appendChild(userIcon);
            }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = text; // Secures the text perfectly inside the solid bubble

            row.appendChild(avatar);
            row.appendChild(bubble);
            return row;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;
            
            if (!apiKey) {
                alert("Please paste your Groq API Key in the top right box first.");
                return;
            }

            if (welcomeScreen.style.display !== 'none') {
                welcomeScreen.style.display = 'none';
            }

            // User Message
            const userMsgElement = createMessageElement(text, 'user');
            chatContainer.appendChild(userMsgElement);
            messages.push({ role: "user", content: text });
            
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading Indicator
            const loadingId = 'loading-' + Date.now();
            const loadingElement = createMessageElement('Analyzing...', 'gyro');
            loadingElement.id = loadingId;
            loadingElement.querySelector('.bubble').classList.add('typing-indicator');
            chatContainer.appendChild(loadingElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192", 
                        messages: messages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                document.getElementById(loadingId).remove();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const gyroReply = data.choices[0].message.content;
                messages.push({ role: "assistant", content: gyroReply });

                // Gyro Message
                const gyroMsgElement = createMessageElement(gyroReply, 'gyro');
                chatContainer.appendChild(gyroMsgElement);
                
            } catch (error) {
                document.getElementById(loadingId).remove();
                const errorElement = createMessageElement(`Connection Error: ${error.message}`, 'gyro');
                errorElement.querySelector('.bubble').style.color = '#ef4444'; // Soft red for errors
                chatContainer.appendChild(errorElement);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyro AI</title>
    <style>
        :root {
            --bg-color: #050608;
            --glass-bg: rgba(20, 25, 30, 0.7);
            --glass-border: rgba(102, 252, 241, 0.15);
            --neon-cyan: #00f2fe;
            --neon-purple: #8a2be2;
            --neon-magenta: #ff00ff;
            --text-main: #c5c6c7;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1a1c23 0%, #050608 80%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- UI Components --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-purple);
        }

        .api-key-container {
            display: flex;
            gap: 10px;
        }

        .api-key-container input {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(102, 252, 241, 0.3);
            color: var(--neon-cyan);
            padding: 10px 20px;
            border-radius: 25px;
            outline: none;
            width: 300px;
            font-family: monospace;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .api-key-container input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4), inset 0 0 10px rgba(0, 242, 254, 0.2);
            color: white;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        main::-webkit-scrollbar {
            width: 6px;
        }
        main::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 10px;
        }

        /* --- Welcome Screen --- */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            transition: opacity 0.5s ease;
        }

        .welcome-text {
            margin-top: 50px;
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--text-light);
            text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-purple);
            letter-spacing: 2px;
            animation: text-pulse 3s ease-in-out infinite alternate;
        }

        @keyframes text-pulse {
            0% { opacity: 0.8; text-shadow: 0 0 15px var(--neon-cyan); }
            100% { opacity: 1; text-shadow: 0 0 25px var(--neon-cyan), 0 0 50px var(--neon-purple); }
        }

        /* --- Chat Messages --- */
        .message-row {
            display: flex;
            margin-bottom: 25px;
            max-width: 85%;
            animation: fadeIn 0.4s ease forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.gyro {
            align-self: flex-start;
        }

        .avatar {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 20px;
        }

        .user-avatar {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-magenta));
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .bubble {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 18px 25px;
            border-radius: 25px;
            color: var(--text-light);
            line-height: 1.6;
            font-size: 1.05rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            white-space: pre-wrap;
            position: relative;
            overflow: hidden;
        }

        .message-row.user .bubble {
            border-bottom-right-radius: 5px;
            background: rgba(138, 43, 226, 0.15);
            border-color: rgba(138, 43, 226, 0.4);
        }

        .message-row.gyro .bubble {
            border-bottom-left-radius: 5px;
            background: rgba(0, 242, 254, 0.05);
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 20px rgba(0, 242, 254, 0.05);
        }

        /* --- Input Area --- */
        .input-area {
            padding: 25px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .input-area textarea {
            flex: 1;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 18px;
            color: white;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            height: 65px;
            transition: all 0.3s ease;
        }

        .input-area textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.15), 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .send-btn {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            border-radius: 20px;
            padding: 0 40px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--neon-cyan);
            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.1);
        }

        .send-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 30px var(--neon-cyan), 0 0 60px var(--neon-cyan);
            text-shadow: none;
            transform: scale(1.05);
        }

        /* --- THE UPGRADED QUANTUM GYRO LOGO --- */
        .gyro-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        .gyro-logo {
            position: relative;
            transform-style: preserve-3d;
            animation: hover-float 4s ease-in-out infinite;
        }

        .size-lg { width: 220px; height: 220px; }
        .size-sm { width: 55px; height: 55px; }

        .ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        /* Ring 1: Inner Cyan Spin */
        .ring-1 {
            border: 3px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 20px var(--neon-cyan);
            animation: spin-x 3s linear infinite;
        }
        .size-lg .ring-1 { border-width: 6px; }

        /* Ring 2: Purple Cross Spin */
        .ring-2 {
            border: 3px solid var(--neon-purple);
            box-shadow: 0 0 25px var(--neon-purple), inset 0 0 25px var(--neon-purple);
            animation: spin-y 4s linear infinite;
        }
        .size-lg .ring-2 { border-width: 6px; }

        /* Ring 3: Magenta Diagonal */
        .ring-3 {
            border: 2px dashed var(--neon-magenta);
            box-shadow: 0 0 15px var(--neon-magenta);
            animation: spin-z 6s linear infinite;
        }
        .size-lg .ring-3 { border-width: 4px; }

        /* Ring 4: Outer Reverse Orbit */
        .ring-4 {
            border: 2px dotted rgba(255, 255, 255, 0.6);
            animation: spin-outer 10s linear infinite reverse;
        }
        .size-lg .ring-4 { border-width: 4px; }

        /* The Quantum Core */
        .core {
            position: absolute;
            top: 38%; left: 38%; right: 38%; bottom: 38%;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 20px #fff, 0 0 50px var(--neon-cyan), 0 0 80px var(--neon-purple);
            animation: core-pulse 1.2s ease-in-out infinite alternate;
        }

        @keyframes hover-float {
            0%, 100% { transform: translateY(0) rotateX(10deg); }
            50% { transform: translateY(-15px) rotateX(0deg); }
        }
        @keyframes spin-x { 0% { transform: rotateX(0deg) rotateY(60deg); } 100% { transform: rotateX(360deg) rotateY(60deg); } }
        @keyframes spin-y { 0% { transform: rotateY(0deg) rotateX(60deg); } 100% { transform: rotateY(360deg) rotateX(60deg); } }
        @keyframes spin-z { 0% { transform: rotateZ(0deg) rotateX(45deg) rotateY(45deg); } 100% { transform: rotateZ(360deg) rotateX(45deg) rotateY(45deg); } }
        @keyframes spin-outer { 0% { transform: scale(1.35) rotate3d(1, 1, 1, 0deg); } 100% { transform: scale(1.35) rotate3d(1, 1, 1, 360deg); } }
        
        @keyframes core-pulse { 
            0% { transform: scale(0.6); opacity: 0.9; box-shadow: 0 0 10px #fff, 0 0 30px var(--neon-cyan); } 
            100% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 30px #fff, 0 0 80px var(--neon-cyan), 0 0 120px var(--neon-purple); } 
        }

        /* Loader */
        .typing-indicator {
            color: var(--neon-cyan);
            font-style: italic;
            font-weight: bold;
            letter-spacing: 1px;
            animation: pulse-opacity 1s infinite alternate;
        }
        @keyframes pulse-opacity {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <div class="gyro-wrapper">
                <div class="gyro-logo size-sm">
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                    <div class="ring ring-4"></div>
                    <div class="core"></div>
                </div>
            </div>
            GYRO
        </div>
        <div class="api-key-container">
            <input type="text" id="api-key" placeholder="Paste Groq API Key here..." autocomplete="off">
        </div>
    </header>

    <main id="chat-container">
        <div id="welcome-screen">
            <div class="gyro-wrapper">
                <div class="gyro-logo size-lg">
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                    <div class="ring ring-4"></div>
                    <div class="core"></div>
                </div>
            </div>
            <div class="welcome-text">SYSTEM ONLINE. I AM GYRO.</div>
        </div>
    </main>

    <div class="input-area">
        <textarea id="user-input" placeholder="Initiate sequence... (Type your message here)" onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        // System prompt to give Gyro his personality
        let messages = [
            { role: "system", content: "Your name is Gyro. You are a highly advanced, cool, and helpful AI assistant. You give concise, smart, and stylistic answers." }
        ];

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('api-key');
        const welcomeScreen = document.getElementById('welcome-screen');

        function createMessageElement(text, sender) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            // Avatar logic
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            
            if (sender === 'gyro') {
                avatar.innerHTML = `
                    <div class="gyro-wrapper">
                        <div class="gyro-logo size-sm">
                            <div class="ring ring-1"></div>
                            <div class="ring ring-2"></div>
                            <div class="ring ring-3"></div>
                            <div class="ring ring-4"></div>
                            <div class="core"></div>
                        </div>
                    </div>
                `;
            } else {
                const userIcon = document.createElement('div');
                userIcon.className = 'user-avatar avatar';
                userIcon.innerText = 'U';
                avatar.appendChild(userIcon);
            }

            // Bubble logic
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = text;

            row.appendChild(avatar);
            row.appendChild(bubble);
            return row;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;
            
            if (!apiKey) {
                alert("Please paste your Groq API Key in the top right box first!");
                return;
            }

            // Hide welcome screen on first message
            if (welcomeScreen.style.display !== 'none') {
                welcomeScreen.style.display = 'none';
            }

            // Add user message to UI and history
            const userMsgElement = createMessageElement(text, 'user');
            chatContainer.appendChild(userMsgElement);
            messages.push({ role: "user", content: text });
            
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Add loading indicator
            const loadingId = 'loading-' + Date.now();
            const loadingElement = createMessageElement('PROCESSING DATA...', 'gyro');
            loadingElement.id = loadingId;
            loadingElement.querySelector('.bubble').classList.add('typing-indicator');
            chatContainer.appendChild(loadingElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Call Groq API
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192", 
                        messages: messages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                // Remove loading indicator
                document.getElementById(loadingId).remove();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const gyroReply = data.choices[0].message.content;
                messages.push({ role: "assistant", content: gyroReply });

                // Add Gyro's message to UI
                const gyroMsgElement = createMessageElement(gyroReply, 'gyro');
                chatContainer.appendChild(gyroMsgElement);
                
            } catch (error) {
                document.getElementById(loadingId).remove();
                const errorElement = createMessageElement(`SYSTEM ERROR: ${error.message}`, 'gyro');
                errorElement.querySelector('.bubble').style.color = '#ff00ff';
                chatContainer.appendChild(errorElement);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>

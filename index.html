<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyro AI</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --glass-bg: rgba(31, 40, 51, 0.6);
            --glass-border: rgba(102, 252, 241, 0.2);
            --neon-cyan: #66fcf1;
            --neon-blue: #45a29e;
            --text-main: #c5c6c7;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1f2833 0%, #0b0c10 70%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- UI Components --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .api-key-container {
            display: flex;
            gap: 10px;
        }

        .api-key-container input {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            outline: none;
            transition: all 0.3s ease;
        }

        .api-key-container input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        main::-webkit-scrollbar {
            width: 8px;
        }
        main::-webkit-scrollbar-thumb {
            background: var(--neon-blue);
            border-radius: 4px;
        }

        /* --- Welcome Screen --- */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            transition: opacity 0.5s ease;
        }

        .welcome-text {
            margin-top: 30px;
            font-size: 2rem;
            color: var(--text-light);
            text-shadow: 0 0 15px var(--neon-blue);
            letter-spacing: 1px;
        }

        /* --- Chat Messages --- */
        .message-row {
            display: flex;
            margin-bottom: 20px;
            max-width: 80%;
            animation: fadeIn 0.4s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.gyro {
            align-self: flex-start;
        }

        .avatar {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 15px;
        }

        .user-avatar {
            background: linear-gradient(135deg, var(--neon-blue), #8a2be2);
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
        }

        .bubble {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 15px 20px;
            border-radius: 20px;
            color: var(--text-light);
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            white-space: pre-wrap;
        }

        .message-row.user .bubble {
            border-bottom-right-radius: 0;
            background: rgba(69, 162, 158, 0.15);
            border-color: rgba(69, 162, 158, 0.4);
        }

        .message-row.gyro .bubble {
            border-bottom-left-radius: 0;
            background: rgba(31, 40, 51, 0.8);
            border-color: rgba(102, 252, 241, 0.3);
        }

        /* --- Input Area --- */
        .input-area {
            padding: 20px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 15px;
        }

        .input-area textarea {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px;
            color: white;
            font-size: 1rem;
            resize: none;
            outline: none;
            height: 60px;
            transition: border-color 0.3s ease;
        }

        .input-area textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: inset 0 0 10px rgba(102, 252, 241, 0.1);
        }

        .send-btn {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            border-radius: 15px;
            padding: 0 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .send-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        /* --- GYRO LOGO ANIMATION (The cool part!) --- */
        .gyro-logo {
            position: relative;
            transform-style: preserve-3d;
            animation: rotate-core 6s linear infinite;
        }

        .size-lg { width: 150px; height: 150px; }
        .size-sm { width: 40px; height: 40px; }

        .ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: solid transparent;
        }

        .size-lg .ring { border-width: 4px; }
        .size-sm .ring { border-width: 2px; }

        .ring-1 {
            border-top-color: var(--neon-cyan);
            border-bottom-color: var(--neon-cyan);
            animation: spin-x 3s linear infinite;
        }

        .ring-2 {
            border-left-color: #8a2be2;
            border-right-color: #8a2be2;
            animation: spin-y 4s linear infinite;
        }

        .ring-3 {
            border-top-color: var(--neon-blue);
            border-bottom-color: var(--neon-blue);
            animation: spin-z 5s linear infinite;
        }

        .core {
            position: absolute;
            top: 40%; left: 40%; right: 40%; bottom: 40%;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px #8a2be2;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes rotate-core { 0% { transform: rotate3d(1, 1, 1, 0deg); } 100% { transform: rotate3d(1, 1, 1, 360deg); } }
        @keyframes spin-x { 0% { transform: rotateX(0deg); } 100% { transform: rotateX(360deg); } }
        @keyframes spin-y { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
        @keyframes spin-z { 0% { transform: rotateZ(0deg); } 100% { transform: rotateZ(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.5); opacity: 1; box-shadow: 0 0 30px var(--neon-cyan), 0 0 60px #8a2be2; } }

        /* Loader */
        .typing-indicator {
            color: var(--neon-blue);
            font-style: italic;
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <div class="gyro-logo size-sm">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <div class="core"></div>
            </div>
            GYRO AI
        </div>
        <div class="api-key-container">
            <input type="password" id="api-key" placeholder="Enter Groq API Key here..." autocomplete="off">
        </div>
    </header>

    <main id="chat-container">
        <div id="welcome-screen">
            <div class="gyro-logo size-lg">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <div class="core"></div>
            </div>
            <div class="welcome-text">I am Gyro. How can I assist you?</div>
        </div>
    </main>

    <div class="input-area">
        <textarea id="user-input" placeholder="Initiate sequence... (Type your message here)" onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        // System prompt to give Gyro his personality
        let messages = [
            { role: "system", content: "Your name is Gyro. You are a highly advanced, cool, and helpful AI assistant. You give concise, smart, and stylistic answers." }
        ];

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('api-key');
        const welcomeScreen = document.getElementById('welcome-screen');

        function createMessageElement(text, sender) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            // Avatar logic
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            
            if (sender === 'gyro') {
                avatar.innerHTML = `
                    <div class="gyro-logo size-sm">
                        <div class="ring ring-1"></div>
                        <div class="ring ring-2"></div>
                        <div class="ring ring-3"></div>
                        <div class="core"></div>
                    </div>
                `;
            } else {
                const userIcon = document.createElement('div');
                userIcon.className = 'user-avatar avatar';
                userIcon.innerText = 'U';
                avatar.appendChild(userIcon);
            }

            // Bubble logic
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = text;

            row.appendChild(avatar);
            row.appendChild(bubble);
            return row;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;
            
            if (!apiKey) {
                alert("Please enter your Groq API Key in the top right corner first!");
                return;
            }

            // Hide welcome screen on first message
            if (welcomeScreen.style.display !== 'none') {
                welcomeScreen.style.display = 'none';
            }

            // Add user message to UI and history
            const userMsgElement = createMessageElement(text, 'user');
            chatContainer.appendChild(userMsgElement);
            messages.push({ role: "user", content: text });
            
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Add loading indicator
            const loadingId = 'loading-' + Date.now();
            const loadingElement = createMessageElement('Thinking...', 'gyro');
            loadingElement.id = loadingId;
            loadingElement.querySelector('.bubble').classList.add('typing-indicator');
            chatContainer.appendChild(loadingElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Call Groq API
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192", // Fast, powerful model on Groq
                        messages: messages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                // Remove loading indicator
                document.getElementById(loadingId).remove();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const gyroReply = data.choices[0].message.content;
                messages.push({ role: "assistant", content: gyroReply });

                // Add Gyro's message to UI
                const gyroMsgElement = createMessageElement(gyroReply, 'gyro');
                chatContainer.appendChild(gyroMsgElement);
                
            } catch (error) {
                document.getElementById(loadingId).remove();
                const errorElement = createMessageElement(`Error: ${error.message}`, 'gyro');
                errorElement.querySelector('.bubble').style.color = '#ff4a4a';
                chatContainer.appendChild(errorElement);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>

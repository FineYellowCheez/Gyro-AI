<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataStream AI</title>
    <style>
        /* --- Clean, Minimal Dark Theme (Gemini Style) --- */
        :root {
            --bg-color: #131314;
            --surface-color: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-cyan: #00f2fe;     
            --accent-purple: #8a2be2;
            --accent-magenta: #ff007f;
            --accent-green: #00ff88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Chat Area --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px 120px 20px; 
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        main::-webkit-scrollbar { width: 8px; }
        main::-webkit-scrollbar-thumb { background: #3c4043; border-radius: 4px; }

        .chat-container-inner {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* --- Welcome Screen --- */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
        }

        .welcome-text {
            margin-top: 30px;
            font-size: 2rem;
            font-weight: 500;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* --- Chat Messages --- */
        .message-row {
            display: flex;
            width: 100%;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.ai {
            justify-content: flex-start;
            gap: 15px;
        }

        /* User Bubble */
        .user-bubble {
            background-color: var(--surface-color);
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 1rem;
            line-height: 1.5;
            max-width: 80%;
            color: var(--text-primary);
            white-space: pre-wrap; /* Ensures line breaks show properly */
        }

        /* AI Text Area */
        .ai-text {
            padding-top: 5px;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-primary);
            width: calc(100% - 50px);
            white-space: pre-wrap; /* Ensures line breaks show properly */
        }

        /* --- Input Area --- */
        .input-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, var(--bg-color) 80%, transparent);
            display: flex;
            justify-content: center;
        }

        .input-box {
            background-color: var(--surface-color);
            border-radius: 24px;
            padding: 10px 15px 10px 25px;
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 800px;
            align-items: flex-end;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            outline: none;
            max-height: 200px;
            min-height: 24px;
            padding-top: 12px;
            padding-bottom: 12px;
            line-height: 1.5;
        }

        .input-box textarea::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
        }

        .send-btn svg {
            fill: currentColor;
            width: 24px;
            height: 24px;
        }

        .send-btn.active {
            color: var(--text-primary);
            background-color: #3c4043;
        }

        /* --- DATA STREAM LOGO ANIMATION --- */
        .logo-box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .size-lg { width: 80px; height: 80px; }
        .size-sm { width: 32px; height: 32px; margin-top: 4px;}

        .datastream {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15%; 
            width: 100%;
            height: 100%;
        }

        .data-line {
            height: 10%; 
            border-radius: 10px;
            animation: data-move 1.2s infinite alternate ease-in-out;
        }

        .data-line:nth-child(1) { width: 100%; background: var(--accent-cyan); animation-delay: 0s; box-shadow: 0 0 8px var(--accent-cyan); }
        .data-line:nth-child(2) { width: 65%; background: var(--accent-purple); animation-delay: 0.2s; box-shadow: 0 0 8px var(--accent-purple); }
        .data-line:nth-child(3) { width: 85%; background: var(--accent-magenta); animation-delay: 0.4s; box-shadow: 0 0 8px var(--accent-magenta); }
        .data-line:nth-child(4) { width: 45%; background: var(--accent-green); animation-delay: 0.6s; box-shadow: 0 0 8px var(--accent-green); }

        @keyframes data-move {
            0% { transform: translateX(-10%); opacity: 0.7; }
            100% { transform: translateX(10%); opacity: 1; }
        }

        /* Loader */
        .typing-indicator {
            color: var(--text-secondary);
            font-style: italic;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
    </style>
</head>
<body>

    <main id="chat-wrapper">
        <div class="chat-container-inner" id="chat-container">
            <div id="welcome-screen">
                <div class="logo-box size-lg">
                    <div class="datastream">
                        <div class="data-line"></div>
                        <div class="data-line"></div>
                        <div class="data-line"></div>
                        <div class="data-line"></div>
                    </div>
                </div>
                <div class="welcome-text">Hello, I am DataStream.</div>
            </div>
        </div>
    </main>

    <div class="input-wrapper">
        <div class="input-box">
            <textarea id="user-input" rows="1" placeholder="Enter a prompt here" oninput="toggleSendButton(this)" onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // PUT YOUR GROQ API KEY HERE 
        // Warning: Keep this file private!
        // ==========================================
        const API_KEY = "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"; 
        
        let messages = [
            { role: "system", content: "Your name is DataStream. You are a highly efficient, intelligent, and helpful AI assistant." }
        ];

        const chatContainer = document.getElementById('chat-container');
        const chatWrapper = document.getElementById('chat-wrapper');
        const userInput = document.getElementById('user-input');
        const welcomeScreen = document.getElementById('welcome-screen');
        const sendBtn = document.getElementById('send-btn');

        // Auto-resize textarea and toggle button color
        function toggleSendButton(element) {
            element.style.height = 'auto';
            element.style.height = (element.scrollHeight) + 'px';
            if (element.value.trim().length > 0) {
                sendBtn.classList.add('active');
            } else {
                sendBtn.classList.remove('active');
            }
        }

        // --- BUG FIX: THIS FUNCTION NOW SAFELY INJECTS TEXT ---
        function createMessageElement(text, sender, isHTML = false) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            if (sender === 'ai') {
                row.innerHTML = `
                    <div class="logo-box size-sm">
                        <div class="datastream">
                            <div class="data-line"></div>
                            <div class="data-line"></div>
                            <div class="data-line"></div>
                            <div class="data-line"></div>
                        </div>
                    </div>
                    <div class="ai-text"></div>
                `;
                // If it's the loading indicator, allow HTML. Otherwise, safely inject text.
                if (isHTML) {
                    row.querySelector('.ai-text').innerHTML = text;
                } else {
                    row.querySelector('.ai-text').innerText = text;
                }
            } else {
                row.innerHTML = `<div class="user-bubble"></div>`;
                row.querySelector('.user-bubble').innerText = text;
            }

            return row;
        }

        async function sendMessage() {
            const text = userInput.value.trim();

            if (!text) return;
            
            if (API_KEY === "YOUR_API_KEY_HERE" || !API_KEY) {
                alert("Please open index.html in a text editor and add your Groq API key to the Javascript section.");
                return;
            }

            if (welcomeScreen.style.display !== 'none') {
                welcomeScreen.style.display = 'none';
            }

            // Add user message to UI
            const userMsgElement = createMessageElement(text, 'user');
            chatContainer.appendChild(userMsgElement);
            messages.push({ role: "user", content: text });
            
            // Reset input area
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.classList.remove('active');
            chatWrapper.scrollTop = chatWrapper.scrollHeight;

            // Loading Indicator (we pass 'true' to allow the span HTML to render)
            const loadingId = 'loading-' + Date.now();
            const loadingElement = createMessageElement('<span class="typing-indicator">Generating response...</span>', 'ai', true);
            loadingElement.id = loadingId;
            chatContainer.appendChild(loadingElement);
            chatWrapper.scrollTop = chatWrapper.scrollHeight;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192", 
                        messages: messages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                document.getElementById(loadingId).remove();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiReply = data.choices[0].message.content;
                messages.push({ role: "assistant", content: aiReply });

                // AI Message (safely injected as text)
                const aiMsgElement = createMessageElement(aiReply, 'ai');
                chatContainer.appendChild(aiMsgElement);
                
            } catch (error) {
                document.getElementById(loadingId).remove();
                const errorElement = createMessageElement(`<span style="color: #ff6b6b;">Error: ${error.message}</span>`, 'ai', true);
                chatContainer.appendChild(errorElement);
            }

            chatWrapper.scrollTop = chatWrapper.scrollHeight;
        }
    </script>
</body>
</html>
